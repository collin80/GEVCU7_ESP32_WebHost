<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEVCU7</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --panel2: #eef0f3; --text: #1b1f24; --muted: #5d6673;
  --line: #d9dde3; --accent: #0b72d9; --ok: #1a8a3c; --warn: #b26a00; --err: #c62828;
  --flash: rgba(11,114,217,.18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --panel: #1a1e24; --panel2: #232830; --text: #e4e7eb; --muted: #8d96a3;
    --line: #2e343d; --accent: #4ea1ff; --ok: #4cc26e; --warn: #f0a83a; --err: #ff6b6b;
    --flash: rgba(78,161,255,.22);
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --panel: #1a1e24; --panel2: #232830; --text: #e4e7eb; --muted: #8d96a3;
  --line: #2e343d; --accent: #4ea1ff; --ok: #4cc26e; --warn: #f0a83a; --err: #ff6b6b;
  --flash: rgba(78,161,255,.22);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 16px; padding: 10px 16px; flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0; letter-spacing: .5px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--err); }
.dot.on { background: var(--ok); }
.meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
nav { display: flex; gap: 4px; margin-left: auto; }
nav button { background: none; border: 1px solid transparent; color: var(--muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
nav button.active { color: var(--text); background: var(--panel2); border-color: var(--line); }
main { max-width: 1200px; margin: 0 auto; padding: 16px; }
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
input[type=search], input[type=text], select { background: var(--panel); color: var(--text); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 8px; font: inherit; min-width: 0; }
input[type=search] { flex: 1 1 220px; max-width: 360px; }
button.btn { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
button.btn.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
button.btn:disabled { opacity: .5; cursor: default; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.card h2 { font-size: 13px; margin: 0; padding: 8px 12px; background: var(--panel2); border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; }
.card h2 span { color: var(--muted); font-weight: normal; }
.srow { display: flex; justify-content: space-between; gap: 12px; padding: 4px 12px; border-bottom: 1px solid var(--line); transition: background .6s; }
.srow:last-child { border-bottom: 0; }
.srow .v { font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, Consolas, monospace; text-align: right; overflow-wrap: anywhere; }
.srow.flash { background: var(--flash); transition: none; }
.layout { display: grid; grid-template-columns: 240px 1fr; gap: 16px; align-items: start; }
.devlist { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; position: sticky; top: 64px; }
.devlist .opt { display: block; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.devlist button { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line);
  padding: 8px 12px; color: var(--text); font: inherit; cursor: pointer; }
.devlist button:last-child { border-bottom: 0; }
.devlist button.active { background: var(--panel2); box-shadow: inset 3px 0 var(--accent); }
.devlist button.disabled { color: var(--muted); }
.devlist small { display: block; color: var(--muted); font-size: 11px; }
#devSelect { display: none; width: 100%; margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { background: var(--panel2); font-size: 12px; color: var(--muted); font-weight: 600; }
td.name { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; white-space: nowrap; }
td .help { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: normal; font-family: system-ui, sans-serif; }
td.cur { font-family: ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
td.cur .desc { display: block; color: var(--muted); font-size: 12px; font-family: system-ui, sans-serif; }
td.edit { white-space: nowrap; }
td.edit input { width: 140px; }
td.edit .range { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
td.edit .err { display: block; color: var(--err); font-size: 11px; margin-top: 3px; }
.empty { color: var(--muted); padding: 24px; text-align: center; background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; }
#toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 10; max-width: calc(100vw - 32px); }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--ok); padding: 8px 12px; border-radius: 6px;
  box-shadow: 0 4px 14px rgba(0,0,0,.2); }
.toast.bad { border-left-color: var(--err); }
.hidden { display: none !important; }
.tchart { margin-bottom: 12px; }
.tchart .plot { position: relative; padding: 10px 12px 0; }
.tchart svg { display: block; width: 100%; touch-action: none; }
.tchart svg text { font: 11px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--muted); }
.tchart svg text.lbl { fill: var(--text); font-weight: 600; }
.tchart .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 4px 8px; font-size: 12px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.15); font-variant-numeric: tabular-nums; }
.tchart .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 6px 12px 10px; font-size: 12px; color: var(--muted); }
.tchart .sw { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--accent); vertical-align: middle; margin-right: 5px; }
.tchart .sw.saved { border-top: 2px dashed var(--muted); }
.tchart .sw.dot { width: 9px; height: 9px; border: 0; border-radius: 50%; background: var(--warn); }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  .devlist { display: none; }
  #devSelect { display: block; }
  thead { display: none; }
  table, tbody, tr, td { display: block; width: 100%; }
  tr { border-bottom: 1px solid var(--line); }
  td { border: 0; padding: 4px 10px; }
  td.name { padding-top: 10px; white-space: normal; }
  td.edit { padding-bottom: 10px; }
  td.edit input { width: calc(100% - 70px); }
  nav { margin-left: 0; }
}
</style>
</head>
<body>
<header>
  <h1>GEVCU7</h1>
  <span class="pill"><span class="dot" id="connDot"></span><span id="connText">Disconnected</span></span>
  <span class="meta" id="uptime"></span>
  <nav>
    <button data-tab="status" class="active">Status</button>
    <button data-tab="config">Configuration</button>
  </nav>
</header>

<main>
  <section id="tab-status">
    <div class="toolbar">
      <input type="search" id="statusFilter" placeholder="Filter status values">
      <span class="meta" id="statusCount"></span>
      <button class="btn ghost" id="statusRefresh">Refresh all</button>
    </div>
    <div class="grid" id="statusGrid"></div>
    <div class="empty" id="statusEmpty">Waiting for status data from GEVCU7…</div>
  </section>

  <section id="tab-config" class="hidden">
    <div class="layout">
      <div class="devlist" id="devList"></div>
      <div>
        <select id="devSelect"></select>
        <div class="toolbar">
          <input type="search" id="cfgFilter" placeholder="Filter parameters">
          <button class="btn ghost" id="cfgReload">Reload</button>
        </div>
        <div id="cfgBody"><div class="empty">Choose a device to see its parameters.</div></div>
      </div>
    </div>
  </section>
</main>
<div id="toasts"></div>

<script>
'use strict';
// ---- state ----
let ws = null, retryDelay = 1000;
const statusValues = {};      // name -> value string
let statusGroups = null;      // device short name -> [status names], from StatusList
const statusRows = {};        // name -> {row, valEl}
let devices = {};             // short name -> {DeviceID, DeviceName, DeviceEnabled, DeviceType}
let showDisabled = false;
let currentDev = null;        // short name of selected device
let currentCfg = null;        // {DevID, entries:{name: entry}}
const pendingSets = {};       // CfgName -> true while waiting for CfgResult
const cfgErrors = {};         // CfgName -> validation message, kept across re-renders

const $ = id => document.getElementById(id);
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function toast(msg, bad) {
  const t = el('div', 'toast' + (bad ? ' bad' : ''), msg);
  $('toasts').appendChild(t);
  setTimeout(() => t.remove(), bad ? 6000 : 3000);
}

// ---- websocket ----
function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify(obj)); return true; }
  toast('Not connected to GEVCU7', true);
  return false;
}
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => {
    retryDelay = 1000;
    $('connDot').classList.add('on');
    $('connText').textContent = 'Connected';
    send({GetStatusList: 1});
    send({GetDevices: 1});
    if (currentCfg) send({GetDevConfig: currentCfg.DevID});
  };
  ws.onclose = () => {
    $('connDot').classList.remove('on');
    $('connText').textContent = 'Disconnected, retrying…';
    setTimeout(connect, retryDelay);
    retryDelay = Math.min(retryDelay * 2, 10000);
  };
  ws.onmessage = ev => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg.Status) onStatus(msg.Status);
    if (msg.StatusList) onStatusList(msg.StatusList);
    if (msg.DeviceList) onDeviceList(msg.DeviceList);
    if (msg.DevConfig) onDevConfig(msg.DevConfig);
    if (msg.CfgResult) onCfgResult(msg.CfgResult);
  };
}

// ---- status ----
const SYSTEM_KEYS = ['timeRunning', 'systemState'];
function onStatus(obj) {
  let newName = false;
  for (const k in obj) {
    const v = String(obj[k]);
    if (!(k in statusValues)) newName = true;
    const changed = statusValues[k] !== v;
    statusValues[k] = v;
    if (k === 'timeRunning') $('uptime').textContent = 'Up ' + v;
    if (changed && (k === 'Pedal_Position' || k === 'Raw_Throttle')) updateThrottleLive();
    const r = statusRows[k];
    if (r && changed) {
      r.valEl.textContent = v;
      r.row.classList.add('flash');
      setTimeout(() => r.row.classList.remove('flash'), 80);
    }
  }
  if (newName) renderStatus();
}
function onStatusList(list) {
  statusGroups = list;
  renderStatus();
}
function renderStatus() {
  const grid = $('statusGrid');
  grid.replaceChildren();
  for (const k in statusRows) delete statusRows[k];
  const filter = $('statusFilter').value.trim().toLowerCase();
  const groups = [];
  const grouped = new Set();
  if (statusGroups) {
    for (const dev of Object.keys(statusGroups).sort()) {
      groups.push([dev, statusGroups[dev]]);
      statusGroups[dev].forEach(n => grouped.add(n));
    }
  }
  const other = Object.keys(statusValues).filter(n => !grouped.has(n)).sort();
  if (other.length) groups.push([statusGroups ? 'System' : 'All values', other]);

  let shown = 0;
  for (const [dev, names] of groups) {
    const match = names.filter(n => !filter || n.toLowerCase().includes(filter) || dev.toLowerCase().includes(filter));
    if (!match.length) continue;
    const card = el('div', 'card');
    const h = el('h2', null, dev);
    h.appendChild(el('span', null, match.length));
    card.appendChild(h);
    for (const n of match) {
      const row = el('div', 'srow');
      row.appendChild(el('span', null, n));
      const v = el('span', 'v', n in statusValues ? statusValues[n] : '—');
      row.appendChild(v);
      card.appendChild(row);
      statusRows[n] = {row, valEl: v};
      shown++;
    }
    grid.appendChild(card);
  }
  $('statusEmpty').classList.toggle('hidden', shown > 0);
  $('statusCount').textContent = shown ? shown + ' values' : '';
}

// ---- devices ----
function onDeviceList(list) {
  devices = list;
  renderDeviceList();
}
function deviceNames() {
  return Object.keys(devices)
    .filter(n => showDisabled || devices[n].DeviceEnabled)
    .sort((a, b) => (devices[b].DeviceEnabled - devices[a].DeviceEnabled) || devices[a].DeviceName.localeCompare(devices[b].DeviceName));
}
function renderDeviceList() {
  const list = $('devList'), sel = $('devSelect');
  list.replaceChildren();
  sel.replaceChildren();
  const opt = el('label', 'opt');
  const cb = el('input');
  cb.type = 'checkbox';
  cb.checked = showDisabled;
  cb.onchange = () => { showDisabled = cb.checked; renderDeviceList(); };
  opt.append(cb, ' Show disabled devices');
  list.appendChild(opt);
  sel.appendChild(new Option('Choose a device…', ''));
  for (const n of deviceNames()) {
    const d = devices[n];
    const b = el('button', d.DeviceEnabled ? '' : 'disabled', d.DeviceName);
    b.appendChild(el('small', null, n + ' · 0x' + d.DeviceID.toString(16).toUpperCase() + ' · ' + d.DeviceType + (d.DeviceEnabled ? '' : ' · disabled')));
    if (n === currentDev) b.classList.add('active');
    b.onclick = () => selectDevice(n);
    list.appendChild(b);
    sel.appendChild(new Option(d.DeviceName + (d.DeviceEnabled ? '' : ' (disabled)'), n, false, n === currentDev));
  }
}
function selectDevice(n) {
  currentDev = n;
  currentCfg = null;
  for (const k in cfgErrors) delete cfgErrors[k];
  renderDeviceList();
  if (!devices[n].DeviceEnabled) {
    $('cfgBody').replaceChildren(el('div', 'empty', devices[n].DeviceName + ' is disabled. Disabled devices don’t register their parameters. Enable it from the serial console (ENABLE=0x' + devices[n].DeviceID.toString(16).toUpperCase() + ') and reboot.'));
    return;
  }
  $('cfgBody').replaceChildren(el('div', 'empty', 'Loading parameters…'));
  send({GetDevConfig: devices[n].DeviceID});
}

// ---- config values ----
// Valu is the raw stored value. Precision: FLOAT = decimal places. Integers: 16 = hex,
// negative N = stored / |N|, positive N = stored * N. Min/MaxValue are already display units.
const INT_TYPES = ['BYTE', 'INT16', 'UINT16', 'INT32', 'UINT32'];
function fmtInt(v, p) { return p === 16 ? '0x' + (v >>> 0).toString(16).toUpperCase() : String(v); }
function displayValue(e) {
  const v = e.Valu, p = e.Precision;
  if (e.ValType === 'STR') return String(v);
  if (e.ValType === 'FLOAT') return Number(v).toFixed(Math.max(0, Math.min(p, 10)));
  if (p < 0) return fmtInt(Math.trunc(v / -p), p);  // console uses integer division too
  if (p > 0 && p !== 16) return fmtInt(v * p, p);
  return fmtInt(v, p);
}
function rangeText(e) {
  if (e.ValType === 'STR') return '';
  if (e.ValType === 'FLOAT') return e.MinValue + ' to ' + e.MaxValue;
  return fmtInt(e.MinValue, e.Precision) + ' to ' + fmtInt(e.MaxValue, e.Precision);
}
// returns [textToSend, null] or [null, errorMessage]
function validate(e, raw) {
  const s = raw.trim();
  if (e.ValType === 'STR') {
    if (raw.length > 200) return [null, 'Too long'];
    return [raw, null];
  }
  if (s === '') return [null, 'Enter a value'];
  let n;
  if (e.ValType === 'FLOAT') {
    n = Number(s);
    if (!isFinite(n)) return [null, 'Not a number'];
  } else {
    n = Number(s);   // accepts 0x hex
    if (!Number.isInteger(n)) return [null, 'Must be a whole number'];
  }
  if (n < e.MinValue) return [null, 'Below minimum ' + rangeText(e).split(' to ')[0]];
  if (n > e.MaxValue) return [null, 'Above maximum ' + rangeText(e).split(' to ')[1]];
  // send plain decimal so GEVCU's strtol never reads a leading 0 as octal
  return [String(n), null];
}
function onDevConfig(obj) {
  const short = Object.keys(obj)[0];
  if (!short) return;
  const d = obj[short];
  if (short !== currentDev) return;   // reply for a device we've navigated away from
  const entries = {};
  for (const k in d) if (k !== 'DevID') entries[k] = d[k];
  currentCfg = {DevID: d.DevID, entries};
  renderConfig();
}
function renderConfig() {
  const body = $('cfgBody');
  if (!currentCfg) return;
  const names = Object.keys(currentCfg.entries);
  if (!names.length) { body.replaceChildren(el('div', 'empty', 'This device has no configurable parameters.')); return; }
  // keep anything the user has typed but not yet sent
  const typed = {};
  body.querySelectorAll('input[data-name]').forEach(i => { if (i.value !== i.defaultValue) typed[i.dataset.name] = i.value; });
  const filter = $('cfgFilter').value.trim().toLowerCase();
  const table = el('table');
  const thead = el('thead'), hr = el('tr');
  ['Parameter', 'Current value', 'New value'].forEach(t => hr.appendChild(el('th', null, t)));
  thead.appendChild(hr);
  table.appendChild(thead);
  const tb = el('tbody');
  for (const n of names) {
    const e = currentCfg.entries[n];
    if (filter && !n.toLowerCase().includes(filter) && !(e.HelpTxt || '').toLowerCase().includes(filter)) continue;
    const tr = el('tr');
    const tdName = el('td', 'name', n);
    tdName.appendChild(el('div', 'help', e.HelpTxt || ''));
    const tdCur = el('td', 'cur', displayValue(e));
    if (e.Desc) tdCur.appendChild(el('span', 'desc', e.Desc));
    const tdEdit = el('td', 'edit');
    const inp = el('input');
    inp.type = 'text';
    inp.dataset.name = n;
    inp.defaultValue = displayValue(e);
    inp.value = n in typed ? typed[n] : inp.defaultValue;
    inp.autocomplete = 'off';
    inp.spellcheck = false;
    const btn = el('button', 'btn', pendingSets[n] ? '…' : 'Set');
    btn.disabled = !!pendingSets[n];
    const hint = el('span', 'range', rangeText(e));
    const err = el('span', 'err' + (cfgErrors[n] ? '' : ' hidden'), cfgErrors[n] || '');
    const submit = () => {
      const [val, msg] = validate(e, inp.value);
      if (msg) cfgErrors[n] = msg; else delete cfgErrors[n];
      err.classList.toggle('hidden', !msg);
      err.textContent = msg || '';
      if (msg) return;
      if (send({DeviceID: currentCfg.DevID, CfgName: n, Valu: val})) {
        pendingSets[n] = true;
        btn.disabled = true;
        btn.textContent = '…';
        setTimeout(() => { if (pendingSets[n]) { delete pendingSets[n]; toast('No reply from GEVCU7 for ' + n, true); renderConfig(); } }, 5000);
      }
    };
    btn.onclick = submit;
    inp.onkeydown = ev => { if (ev.key === 'Enter') submit(); };
    inp.oninput = () => { delete cfgErrors[n]; err.classList.add('hidden'); redrawThrottle(); };
    tdEdit.append(inp, ' ', btn, hint, err);
    tr.append(tdName, tdCur, tdEdit);
    tb.appendChild(tr);
  }
  table.appendChild(tb);
  if (isThrottleCfg()) {
    body.replaceChildren(throttleCard(), table);
    drawThrottleChart();
  } else body.replaceChildren(table);
}

// ---- throttle map chart ----
// Mirrors Throttle::mapPedalPosition() in the GEVCU7 firmware. Pedal and output are permille,
// map/regen positions are stored permille, regen/creep percentages are stored as plain percent.
const THROTTLE_KEYS = ['TRNGMAX', 'TRNGMIN', 'TFWD', 'TMAP1IN', 'TMAP1OUT', 'TMAP2IN', 'TMAP2OUT',
                       'TMAP3IN', 'TMAP3OUT', 'TMINRN', 'TMAXRN', 'TCREEP'];
let throttleChart = null;     // {card, plot, svgWrap, tip, legend, c, x, y, live}
function isThrottleCfg() { return !!currentCfg && THROTTLE_KEYS.every(k => k in currentCfg.entries); }
function arduinoMap(x, inMin, inMax, outMin, outMax) {
  if (inMax === inMin) return outMin;   // ARM integer divide by zero yields 0
  return Math.trunc((x - inMin) * (outMax - outMin) / (inMax - inMin)) + outMin;
}
// display units -> stored value, inverse of displayValue()
function toRaw(e, n) {
  const p = e.Precision;
  if (e.ValType === 'FLOAT' || p === 0 || p === 16) return n;
  return p < 0 ? n * -p : n / p;
}
// stored params, optionally overridden by valid values typed into the table but not yet sent
function throttleParams(useTyped) {
  const c = {};
  for (const k of THROTTLE_KEYS.concat('TSMOOTH', 'TSMOOTHCUT')) {
    const e = currentCfg.entries[k];
    if (!e) continue;
    c[k] = Number(e.Valu);
    if (!useTyped) continue;
    const i = $('cfgBody').querySelector('input[data-name="' + k + '"]');
    if (i && i.value !== i.defaultValue) {
      const [v] = validate(e, i.value);
      if (v !== null) c[k] = toRaw(e, Number(v));
    }
  }
  return c;
}
function mapPedal(c, p) {
  const m = [[c.TMAP1IN, c.TMAP1OUT], [c.TMAP2IN, c.TMAP2OUT], [c.TMAP3IN, c.TMAP3OUT]];
  let t = 0;
  if (p === 0 && c.TCREEP > 0) t = 10 * c.TCREEP;
  else if (p <= c.TRNGMIN && p >= c.TRNGMAX) {
    const range = c.TRNGMIN - c.TRNGMAX, value = p - c.TRNGMAX;
    if (range !== 0) t = -10 * c.TMINRN + Math.trunc((c.TMAXRN - c.TMINRN) * (100 - Math.trunc(value * 100 / range)) / -10);
  }
  if (p >= c.TFWD) {
    t = arduinoMap(p, c.TFWD, m[0][0], 0, m[0][1]);
    if (p >= m[0][0] && m[1][0] > m[0][0]) t = arduinoMap(p, m[0][0], m[1][0], m[0][1], m[1][1]);
    if (p >= m[1][0] && m[2][0] > m[1][0]) t = arduinoMap(p, m[1][0], m[2][0], m[1][1], m[2][1]);
    if (p >= m[2][0] && m[2][0] < 1000) t = arduinoMap(p, m[2][0], 1000, m[2][1], 1000);
  }
  if (t < -1090 || t > 1090) return 0;   // firmware raises a fault and outputs 0
  if (t > 979) t = 1000;
  return t;
}
function svgEl(tag, attrs, text) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}
const pct = v => (v / 10).toFixed(1).replace(/\.0$/, '') + '%';
function throttleCard() {
  if (throttleChart) return throttleChart.card;
  const card = el('div', 'card tchart');
  const h = el('h2', null, 'Throttle map');
  h.appendChild(el('span', null, 'pedal position → motor torque'));
  const plot = el('div', 'plot'), svgWrap = el('div'), tip = el('div', 'tip hidden'), legend = el('div', 'legend');
  plot.append(svgWrap, tip);
  card.append(h, plot, legend);
  throttleChart = {card, plot, svgWrap, tip, legend};
  return card;
}
function redrawThrottle() { if (throttleChart && throttleChart.card.isConnected) drawThrottleChart(); }
function drawThrottleChart() {
  const tc = throttleChart;
  const c = throttleParams(true), saved = throttleParams(false);
  const preview = Object.keys(c).some(k => c[k] !== saved[k]);
  const W = Math.max(280, (tc.plot.clientWidth || 640) - 24), H = W < 520 ? 230 : 290;
  const ml = 46, mr = 14, mt = 18, mb = 36, pw = W - ml - mr, ph = H - mt - mb;
  const x = p => ml + Math.max(0, Math.min(1000, p)) / 1000 * pw;
  const y = t => mt + (1000 - t) / 2000 * ph;
  Object.assign(tc, {c, x, y, ml, pw});
  const svg = svgEl('svg', {width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, role: 'img',
    'aria-label': 'Throttle map: motor torque from -100% (regen) to 100% versus pedal position 0 to 100%'});

  // zones
  const zone = (a, b, color, label) => {
    if (b <= a) return;
    svg.appendChild(svgEl('rect', {x: x(a), y: mt, width: x(b) - x(a), height: ph, fill: color, 'fill-opacity': .09}));
    if (x(b) - x(a) > 44) svg.appendChild(svgEl('text', {x: (x(a) + x(b)) / 2, y: mt - 5, 'text-anchor': 'middle'}, label));
  };
  zone(c.TRNGMAX, c.TRNGMIN, 'var(--ok)', 'Regen');
  zone(c.TRNGMIN, c.TFWD, 'var(--muted)', 'Coast');
  zone(c.TFWD, 1000, 'var(--accent)', 'Drive');

  // grid + axes
  for (const t of [-1000, -500, 0, 500, 1000]) {
    svg.appendChild(svgEl('line', {x1: ml, x2: ml + pw, y1: y(t), y2: y(t), stroke: t ? 'var(--line)' : 'var(--muted)', 'stroke-width': 1}));
    svg.appendChild(svgEl('text', {x: ml - 6, y: y(t) + 4, 'text-anchor': 'end'}, pct(t)));
  }
  for (const p of [0, 250, 500, 750, 1000]) {
    svg.appendChild(svgEl('line', {x1: x(p), x2: x(p), y1: mt, y2: mt + ph, stroke: 'var(--line)', 'stroke-width': 1, 'stroke-dasharray': p % 1000 ? '2 3' : ''}));
    svg.appendChild(svgEl('text', {x: x(p), y: mt + ph + 15, 'text-anchor': p === 0 ? 'start' : p === 1000 ? 'end' : 'middle'}, pct(p)));
  }
  svg.appendChild(svgEl('text', {x: ml + pw / 2, y: H - 3, 'text-anchor': 'middle'}, 'Pedal position'));
  svg.appendChild(svgEl('text', {x: 11, y: mt + ph / 2, 'text-anchor': 'middle', transform: 'rotate(-90 11 ' + (mt + ph / 2) + ')'}, 'Torque'));

  // smoothing applies below this output level
  if (c.TSMOOTH > 0 && c.TSMOOTHCUT > 0) {
    svg.appendChild(svgEl('line', {x1: ml, x2: ml + pw, y1: y(c.TSMOOTHCUT), y2: y(c.TSMOOTHCUT), stroke: 'var(--muted)', 'stroke-dasharray': '6 4'}));
    // left side: the curve is in regen/coast there, so the label stays clear of the map points
    svg.appendChild(svgEl('text', {x: ml + 4, y: y(c.TSMOOTHCUT) - 5}, 'Smoothing below ' + pct(c.TSMOOTHCUT)));
  }

  // curves (creep only applies at exactly 0 pedal, so it's drawn as a marker instead)
  const path = cfg => {
    let d = '';
    for (let p = cfg.TCREEP > 0 ? 1 : 0; p <= 1000; p++) d += (d ? 'L' : 'M') + x(p).toFixed(1) + ' ' + y(mapPedal(cfg, p)).toFixed(1);
    return d;
  };
  if (preview) svg.appendChild(svgEl('path', {d: path(saved), fill: 'none', stroke: 'var(--muted)', 'stroke-width': 2, 'stroke-dasharray': '5 4'}));
  svg.appendChild(svgEl('path', {d: path(c), fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2, 'stroke-linejoin': 'round'}));

  // parameter markers
  const dot = (p, t, color, label, below) => {
    svg.appendChild(svgEl('circle', {cx: x(p), cy: y(t), r: 4.5, fill: color, stroke: 'var(--panel)', 'stroke-width': 2}));
    if (label) svg.appendChild(svgEl('text', {class: 'lbl', x: x(p), y: y(t) + (below ? 17 : -9), 'text-anchor': p > 960 ? 'end' : p < 40 ? 'start' : 'middle'}, label));
  };
  if (c.TRNGMIN > c.TRNGMAX) {
    dot(c.TRNGMAX, -10 * c.TMAXRN, 'var(--ok)', '', true);
    dot(c.TRNGMIN, -10 * c.TMINRN, 'var(--ok)', '', true);
  }
  dot(c.TFWD, 0, 'var(--accent)', '', true);
  const seen = new Set();
  [[c.TMAP1IN, c.TMAP1OUT], [c.TMAP2IN, c.TMAP2OUT], [c.TMAP3IN, c.TMAP3OUT]].forEach(([i, o], n) => {
    if (i < c.TFWD) return;
    const key = i + ',' + o, dup = seen.has(key);   // defaults stack all three points
    seen.add(key);
    if (!dup) dot(i, mapPedal(c, i), 'var(--accent)', 'M' + (n + 1));
  });
  if (c.TCREEP > 0) dot(0, 10 * c.TCREEP, 'var(--accent)', 'Creep');

  // hover layer
  const vline = svgEl('line', {y1: mt, y2: mt + ph, stroke: 'var(--muted)', 'stroke-width': 1, visibility: 'hidden'});
  const hdot = svgEl('circle', {r: 4.5, fill: 'var(--accent)', stroke: 'var(--panel)', 'stroke-width': 2, visibility: 'hidden'});
  tc.live = svgEl('circle', {r: 6, fill: 'var(--warn)', stroke: 'var(--panel)', 'stroke-width': 2, visibility: 'hidden'});
  const hit = svgEl('rect', {x: ml, y: 0, width: pw, height: H, fill: 'transparent'});
  svg.append(vline, hdot, tc.live, hit);
  const move = ev => {
    const r = svg.getBoundingClientRect();
    const p = Math.round(Math.max(0, Math.min(1000, (ev.clientX - r.left - ml) / pw * 1000)));
    const t = mapPedal(c, p);
    vline.setAttribute('x1', x(p)); vline.setAttribute('x2', x(p));
    hdot.setAttribute('cx', x(p)); hdot.setAttribute('cy', y(t));
    vline.setAttribute('visibility', 'visible'); hdot.setAttribute('visibility', 'visible');
    tc.tip.textContent = 'Pedal ' + pct(p) + ' → ' + (t < 0 ? 'regen ' + pct(-t) : t > 0 ? pct(t) + ' torque' : 'no torque');
    tc.tip.classList.remove('hidden');
    const tx = 12 + x(p), tw = tc.tip.offsetWidth;
    tc.tip.style.left = (tx + tw + 12 > W ? tx - tw - 24 : tx + 10) + 'px';
    tc.tip.style.top = Math.max(0, Math.min(y(t) - 14, H - 30)) + 'px';
  };
  hit.onpointermove = move;
  hit.onpointerdown = move;
  hit.onpointerleave = () => { vline.setAttribute('visibility', 'hidden'); hdot.setAttribute('visibility', 'hidden'); tc.tip.classList.add('hidden'); };
  tc.svgWrap.replaceChildren(svg);

  // legend
  const item = (cls, text) => { const s = el('span'); s.append(el('span', 'sw' + cls), text); return s; };
  tc.legend.replaceChildren(item('', preview ? 'Preview of unsaved edits' : 'Current map'));
  if (preview) tc.legend.appendChild(item(' saved', 'Saved map'));
  tc.liveLegend = item(' dot', 'Live pedal');
  tc.liveLegend.classList.add('hidden');
  tc.legend.appendChild(tc.liveLegend);
  updateThrottleLive();
}
function updateThrottleLive() {
  const tc = throttleChart;
  if (!tc || !tc.live || !tc.card.isConnected) return;
  const p = Number(statusValues.Pedal_Position), t = Number(statusValues.Raw_Throttle);
  const ok = 'Pedal_Position' in statusValues && 'Raw_Throttle' in statusValues && isFinite(p) && isFinite(t);
  tc.live.setAttribute('visibility', ok ? 'visible' : 'hidden');
  tc.liveLegend.classList.toggle('hidden', !ok);
  if (ok) { tc.live.setAttribute('cx', tc.x(p)); tc.live.setAttribute('cy', tc.y(Math.max(-1000, Math.min(1000, t)))); }
}
function onCfgResult(r) {
  delete pendingSets[r.CfgName];
  const msgs = {0: 'Set ' + r.CfgName + ' to ' + r.Valu, 1: r.CfgName + ': value below minimum',
                2: r.CfgName + ': value above maximum', 3: r.CfgName + ': no such device or setting'};
  toast(msgs[r.Result] || (r.CfgName + ': unknown result'), r.Result !== 0);
  // GEVCU7 follows a CfgResult with a fresh DevConfig which re-renders the table. Drop the typed
  // value for this entry so the input shows what's actually stored.
  const inp = document.querySelector('input[data-name="' + CSS.escape(r.CfgName) + '"]');
  if (inp && r.Result === 0) inp.value = inp.defaultValue;
  renderConfig();
}

// ---- ui wiring ----
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
  $('tab-status').classList.toggle('hidden', b.dataset.tab !== 'status');
  $('tab-config').classList.toggle('hidden', b.dataset.tab !== 'config');
  try { localStorage.setItem('gevcuTab', b.dataset.tab); } catch (e) {}
  redrawThrottle();   // width is 0 while the tab is hidden
});
window.addEventListener('resize', redrawThrottle);
$('statusFilter').oninput = renderStatus;
$('statusRefresh').onclick = () => { send({GetStatusList: 1}); send({GetStatus: 1}); };
$('cfgFilter').oninput = renderConfig;
$('cfgReload').onclick = () => { send({GetDevices: 1}); if (currentDev && devices[currentDev]) selectDevice(currentDev); };
$('devSelect').onchange = ev => { if (ev.target.value) selectDevice(ev.target.value); };
try { const t = localStorage.getItem('gevcuTab'); if (t) document.querySelector('nav button[data-tab="' + t + '"]').click(); } catch (e) {}

connect();
</script>
